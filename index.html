<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora | Despliegue continuo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 20px 60px #0005;
    }
    .etiqueta {
      color: #5eead4;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    h1 { margin-bottom: 10px; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; }
    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #64748b;
      background: #0f172a;
      color: white;
    }
    button {
      margin-top: 24px;
      border: 0;
      background: #2dd4bf;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #5eead4; }
    output {
      display: block;
      margin-top: 24px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      overflow-wrap: anywhere;
    }
    footer {
      margin-top: 24px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <span class="etiqueta">PROYECTO · DESPLIEGUE CONTINUO</span>
    <h1>Calculadora web</h1>
    <p>Selecciona una operación y escribe los números.</p>

    <form id="calculadora">
      <label for="numero1">Primer número</label>
      <input id="numero1" type="number" step="any" required
             placeholder="Ejemplo: 10">

      <label for="operacion">Operación</label>
      <select id="operacion">
        <option value="sumar">Suma (+)</option>
        <option value="restar">Resta (-)</option>
        <option value="multiplicar">Multiplicación (×)</option>
        <option value="dividir">División (÷)</option>
      </select>

      <label for="numero2">Segundo número</label>
      <input id="numero2" type="number" step="any" required
             placeholder="Ejemplo: 5">

      <button type="submit">Calcular resultado</button>
    </form>

    <output id="resultado" aria-live="polite">Resultado: —</output>
    <footer>Versión 1.0 · Actividad 4 · Unidad 2</footer>
  </main>

  <script>
    document.getElementById("calculadora").addEventListener("submit", function(event) {
      event.preventDefault();

      const a = Number(document.getElementById("numero1").value);
      const b = Number(document.getElementById("numero2").value);
      const operacion = document.getElementById("operacion").value;
      const salida = document.getElementById("resultado");
      let resultado;

      if (!Number.isFinite(a) || !Number.isFinite(b)) {
        salida.textContent = "Introduce números válidos.";
        return;
      }

      switch (operacion) {
        case "sumar":
          resultado = a + b;
          break;
        case "restar":
          resultado = a - b;
          break;
        case "multiplicar":
          resultado = a * b;
          break;
        case "dividir":
          if (b === 0) {
            salida.textContent = "No se puede dividir entre cero.";
            return;
          }
          resultado = a / b;
          break;
      }

      salida.textContent = Number.isFinite(resultado)
        ? "Resultado: " + resultado
        : "El resultado excede el rango permitido.";
    });
  </script>
</body>
</html>
